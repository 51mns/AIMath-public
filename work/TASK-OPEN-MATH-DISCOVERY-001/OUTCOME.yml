schema_version: 1
task_id: TASK-OPEN-MATH-DISCOVERY-001
outcome_type: LITERATURE_MATCH
summary: >-
  Exact bounded discovery on P_m(q)=prod_{j=1}^m(1+q^j) independently
  rediscovered the classical shifted-staircase unimodality theorem. A stronger
  near-strict pattern, a_m(s)<a_m(s+1) for 4<=s<T_m/2, passed exact train
  m=12..14, pre-frozen held-out m=15..30, and post-held-out stress m=31..80,
  but no universal proof or novelty conclusion is established. Global
  log-concavity is refuted at m=3,s=2, and standard strict unimodality is
  refuted for every m by a_m(0)=a_m(1)=1.
