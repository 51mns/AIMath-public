name: Activate validated Village lock

on:
  workflow_run:
    workflows: ["Verify public release"]
    types: [completed]

# Trusted-main lifecycle mutation. A PR-head Verify success is a trigger only;
# scripts/lock_auto_activate.py rederives RELEASE/ACQUIRE eligibility from current main.
permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: village-lock-lifecycle
  cancel-in-progress: false

jobs:
  activate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Revalidate trusted Village lock lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/lock_auto_activate.py
