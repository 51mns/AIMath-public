name: Review Village v1.3 live Phase 0 effective rules

on:
  pull_request:
    paths:
      - '.github/workflows/review-village-v1-3-live-phase0-effective-rules.yml'

permissions:
  contents: read

jobs:
  effective_rules:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed main substrate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assert reviewed production main
        shell: bash
        run: |
          test "$(git rev-parse HEAD^1 2>/dev/null || true)" = "7dc8541c0a9e19f37910e06bc4738375c4c7af00" || \
          test "${{ github.event.pull_request.base.sha }}" = "7dc8541c0a9e19f37910e06bc4738375c4c7af00"

      - name: Fresh-read effective rules for main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = "51mns/AIMath-public"
          url_base = f"https://api.github.com/repos/{repo}/rules/branches/main"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "aimath-village-phase0-review-validation",
          }

          rules = []
          complete = False
          pages = 0
          for page in range(1, 11):
              req = urllib.request.Request(
                  f"{url_base}?per_page=100&page={page}", headers=headers
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  if resp.status != 200:
                      raise SystemExit(f"unexpected HTTP status {resp.status}")
                  payload = json.load(resp)
              if not isinstance(payload, list):
                  raise SystemExit("effective rules response is not a list")
              pages = page
              rules.extend(payload)
              if len(payload) < 100:
                  complete = True
                  break

          if not complete:
              raise SystemExit("effective rules pagination completeness unproven")

          ids = sorted({r.get("ruleset_id") for r in rules if isinstance(r, dict) and isinstance(r.get("ruleset_id"), int)})
          types = sorted({r.get("type") for r in rules if isinstance(r, dict) and isinstance(r.get("type"), str)})
          print(f"EFFECTIVE_RULES_PAGES={pages}")
          print(f"EFFECTIVE_RULES_COUNT={len(rules)}")
          print("EFFECTIVE_RULESET_IDS=" + ",".join(map(str, ids)))
          print("EFFECTIVE_RULE_TYPES=" + ",".join(types))

          matches = []
          for rule in rules:
              if not isinstance(rule, dict) or rule.get("type") != "required_status_checks":
                  continue
              params = rule.get("parameters")
              if not isinstance(params, dict):
                  continue
              checks = params.get("required_status_checks")
              if not isinstance(checks, list):
                  continue
              contexts = []
              for item in checks:
                  if isinstance(item, dict) and isinstance(item.get("context"), str):
                      contexts.append(item["context"])
                  elif isinstance(item, str):
                      contexts.append(item)
              if (
                  rule.get("ruleset_id") == 22089746
                  and params.get("strict_required_status_checks_policy") is True
                  and "verify" in contexts
              ):
                  matches.append({
                      "ruleset_id": rule.get("ruleset_id"),
                      "type": rule.get("type"),
                      "strict": params.get("strict_required_status_checks_policy"),
                      "contexts": sorted(contexts),
                  })

          if not matches:
              raise SystemExit("required effective strict verify rule from ruleset 22089746 not proven")

          print("EFFECTIVE_REQUIRED_STATUS_PROOF=" + json.dumps(matches, sort_keys=True, separators=(",", ":")))
          print("EFFECTIVE_RULES_GATE=PASS")
          PY
