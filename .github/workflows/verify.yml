name: Verify public release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Public safety audit
        run: python3 scripts/public_release_audit.py .

      - name: Verify public layout
        run: python3 scripts/verify_public_layout.py .

      - name: Reproduce fixed-433 package
        run: python3 research/fixed-433/reproduce.py
