  "objective": "Freeze a bias-controlled pilot for AIMath Factor Representation Discovery (AFRD): test whether AI can invent mathematical representations X(N) of composite integers that expose information about hidden factors without mandating a human-selected primitive vocabulary. This E0 task freezes the data, leakage, hidden-evaluation, baseline, audit-sequencing, and promotion contracts. Candidate-specific novelty and reduction-to-known-mathematics analysis must occur only after X(N) is frozen and earns held-out signal, so prior-work hints do not steer the discovery search.",
  "assumptions": [
    "training data may contain labelled tuples (N,p,q), but every deployed candidate representation or feature on a held-out target must be computable from N and public experiment constants alone",
    "p and q may be used only for labels, scoring, falsification, and post-hoc analysis; they are forbidden as evaluation-time inputs to X(N)",
    "LLMs may already know gcd, Fermat, Pollard rho, modular arithmetic, lattices, and other number theory, so primitive-free prompting is not evidence of novelty",
    "the discovery phase does not ban known ideas, but it must not receive candidate-specific novelty hints, hidden-test answers, another discovery lane's frozen representation, or instructions such as 'avoid Fermat' that would bias the search",
    "known factorisation methods and closest prior work may be prepared as a sequestered evaluator-side baseline before discovery, but the candidate-specific novelty/reduction audit is unsealed only after representation freeze and held-out performance gating",
    "a representation that is useful but reducible to known mathematics may still be an engineering result, but it is not a new-mathematics result"
  ],
