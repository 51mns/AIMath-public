    "hidden evaluation lacks at least the H0-H5 separation needed to test interpolation, scale, balance, arithmetic, generator, and temporal transfer",
    "candidate-specific novelty knowledge is exposed before representation freeze in a way that materially steers the search",
    "the only apparent success disappears under generator shift, temporal holdout, or independent falsification"
