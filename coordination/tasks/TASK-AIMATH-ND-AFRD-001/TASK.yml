  "success_conditions": [
    "freeze an evaluator-side prior-work and baseline packet that is not exposed to the discovery lane before X(N) freeze",
    "freeze a discovery/audit information firewall specifying exactly what the discovery lane, evaluator, falsifier, and later novelty auditor may inspect and when",
    "freeze H0 interpolation: same bit range and same generation distribution as training but unseen N",
    "freeze H1 scale extrapolation: larger bit lengths than the discovery-training range",
    "freeze H2 balance shift: transfer between balanced semiprimes and deliberately unbalanced p,q regimes",
    "freeze H3 arithmetic shift: held-out families varying p-1 or q-1 smoothness, safe-prime structure, and selected modular classes",
    "freeze H4 generator shift: hidden instances produced by an independently implemented generator and independent randomness source",
    "freeze H5 temporal holdout: hidden instances generated only after the experiment and representation interfaces are frozen",
    "leakage firewall rejects any claimed factor-relevant signal whose evaluation-time computation requires p, q, factor-derived hidden labels, accepted proofs, hidden answers, or another lane's unpublished representation",
    "candidate interface defines X(N), its evaluation-time computability and cost, factor-relevant utility metrics, falsification criteria, and the exact freeze point before hidden evaluation",
    "only candidates passing a predeclared held-out utility gate proceed to candidate-specific literature search, independent-AI reduction, symbolic simplification, known-invariant comparison, and mathematical analysis",
    "produce a concrete follow-up gate sequence for AFRD representation discovery, invariant extraction, algorithm synthesis, adversarial falsification, and mathematical extraction",
    "define promotion to a standalone CAM-AFRD only if a reusable representation or sustained multi-task research programme emerges; otherwise AFRD remains an AIMath-ND experiment"
  ],
  "failure_conditions": [
